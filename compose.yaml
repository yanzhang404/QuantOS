name: quantos

# Phase 0 intentionally provisions no persistent infrastructure. This opt-in
# smoke service keeps the Compose contract testable without running by default.
services:
  foundation-check:
    image: alpine:3.20
    profiles: ["tools"]
    command: ["/bin/sh", "-c", "echo 'QuantOS Phase 0 foundation is ready'"]

  research-api:
    profiles: ["research"]
    image: quantos-research-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      QUANTOS_ALLOWED_ORIGIN: "${QUANTOS_ALLOWED_ORIGIN:-http://localhost:3000}"
      QUANTOS_QUEUE_SIZE: "${QUANTOS_QUEUE_SIZE:-32}"
      QUANTOS_REQUIRED_BUNDLE: "${QUANTOS_REQUIRED_BUNDLE:-}"
    ports:
      - "8080:8080"
    volumes:
      - ./data:/var/lib/quantos/data
      - ./artifacts/experiments:/var/lib/quantos/artifacts/experiments
      - ./var/quantos/tasks:/var/lib/quantos/tasks
      - ./var/quantos/intelligence:/var/lib/quantos/intelligence
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  intelligence-refresh:
    profiles: ["research-admin"]
    image: quantos-research-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    entrypoint: ["/app/.venv/bin/quantos"]
    command:
      - intelligence
      - refresh
      - --input-root
      - /var/lib/quantos/intelligence-inputs
      - --history-root
      - /var/lib/quantos/intelligence-observations
      - --output-root
      - /var/lib/quantos/intelligence
    volumes:
      - ./var/quantos/intelligence:/var/lib/quantos/intelligence
      - ./var/quantos/intelligence-inputs:/var/lib/quantos/intelligence-inputs
      - ./var/quantos/intelligence-observations:/var/lib/quantos/intelligence-observations
