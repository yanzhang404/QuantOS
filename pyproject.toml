[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "quantos-research"
version = "0.4.0"
description = "Reproducible crypto strategy research workflows for QuantOS"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Yan Zhang" }]
dependencies = [
  "duckdb>=1.4,<2",
  "httpx>=0.28,<1",
  "pyarrow>=20,<26",
  "pytz>=2025.2",
]

[project.scripts]
quantos = "quantos_cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = [
  "apps/worker/src/quantos_cli",
  "packages/api-schema/src/quantos_api_contracts",
  "packages/event-schema/src/quantos_events",
  "packages/metrics/src/quantos_metrics",
  "packages/strategy-sdk/src/quantos_strategy",
  "services/backtest/src/quantos_backtest",
  "services/market-data/src/quantos_market_data",
  "services/research/src/quantos_research",
  "services/agent/src/quantos_intelligence",
  "services/agent/src/quantos_radar",
  "services/agent/src/quantos_candidates",
]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.coverage.run]
branch = true
source = [
  "quantos_api_contracts",
  "quantos_backtest",
  "quantos_candidates",
  "quantos_cli",
  "quantos_events",
  "quantos_intelligence",
  "quantos_market_data",
  "quantos_radar",
  "quantos_metrics",
  "quantos_research",
  "quantos_strategy",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
