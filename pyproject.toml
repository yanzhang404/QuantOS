[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "quantos-market-data"
version = "0.1.0"
description = "Reproducible market-data foundation for QuantOS"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Yan Zhang" }]
dependencies = [
  "duckdb>=1.4,<2",
  "httpx>=0.28,<1",
  "pyarrow>=20,<26",
  "pytz>=2025.2",
]

[project.scripts]
quantos = "quantos_market_data.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["services/market-data/src/quantos_market_data"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.coverage.run]
branch = true
source = ["quantos_market_data"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
