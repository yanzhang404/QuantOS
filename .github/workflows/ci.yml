name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  repository-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository structure
        run: bash scripts/validate_structure.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install market-data package
        run: python -m pip install -e services/market-data

      - name: Test market-data services
        run: python -m unittest discover -s services/market-data/tests -v

      - name: Validate Docker Compose
        run: docker compose config
